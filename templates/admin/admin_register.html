<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>管理员/医生注册</title>
    <link href="//unpkg.com/layui@2.10.1/dist/css/layui.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//unpkg.com/layui@2.10.1/dist/layui.js"></script>
    <style>
        .register-form {
            padding: 20px 30px;
            width: 500px;
            margin: 80px auto;
        }
    </style>

    <!-- 字体图标备用方案 -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // 检查字体图标是否正确加载
        setTimeout(function() {
            var testIcon = document.createElement('i');
            testIcon.className = 'fas fa-user';
            testIcon.style.visibility = 'hidden';
            document.body.appendChild(testIcon);
            
            var iconStyle = window.getComputedStyle(testIcon);
            var isFontLoaded = iconStyle.fontFamily.includes('Font Awesome') || 
                               iconStyle.fontFamily.includes('FontAwesome');
            
            if (!isFontLoaded) {
                console.log('字体图标未正确加载，加载备用方案');
                // 加载备用CSS
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = '../static/download_style/css/font-awesome-4.7.0.min.css';
                document.head.appendChild(link);
            }
            
            document.body.removeChild(testIcon);
        }, 500);
    });
    </script>
    </head>
<body>
<div class="layui-container">
    <div class="layui-form register-form">
        <form id="adminRegisterForm">
            <div class="layui-form-item">
                <h2 style="text-align:center;">管理员/医生注册</h2>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">角色</label>
                <div class="layui-input-block">
                    <input type="radio" name="role" value="admin" title="管理员">
                    <input type="radio" name="role" value="doctor" title="医生" checked>
                </div>
            </div>

            <div class="layui-form-item">
                <input type="text" name="username" required placeholder="请输入用户名" class="layui-input">
            </div>

            <div class="layui-form-item">
                <input type="password" name="password" required placeholder="请输入密码" class="layui-input">
            </div>

            <div class="layui-form-item">
                <input type="password" name="confirm_password" required placeholder="请确认密码" class="layui-input">
            </div>

            <div class="layui-form-item">
                <input type="text" name="real_name" required placeholder="请输入真实姓名" class="layui-input">
            </div>

            <div class="layui-form-item">
                <input type="text" name="id_card" required placeholder="请输入身份证号" class="layui-input">
            </div>

            <div class="layui-form-item">
                <input type="text" name="phone" required placeholder="请输入手机号" class="layui-input">
            </div>

            <div class="layui-form-item">
                <button type="submit" class="layui-btn layui-btn-fluid">注 册</button>
            </div>

            <div class="layui-form-item" style="text-align:center;">
                <a href="{{ url_for('login') }}">已有账号？去登录</a>
            </div>
        </form>
    </div>
</div>

<script>
    $('#adminRegisterForm').on('submit', function (e) {
        e.preventDefault();
        $.ajax({
            url: '/admin_register_public',
            type: 'POST',
            data: $(this).serialize(),
            success: function (res) {
                if (res.status === 'success') {
                    layer.msg(res.message, {icon: 1}, function () {
                        window.location.href = res.redirect;
                    });
                } else {
                    layer.msg(res.message, {icon: 2});
                }
            },
            error: function () {
                layer.msg("网络错误", {icon: 2});
            }
        });
    });
</script>
</body>
</html>
