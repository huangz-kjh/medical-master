<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>编辑用户</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link href="//unpkg.com/layui@2.10.1/dist/css/layui.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/layui/2.5.5/layui.min.js"></script>

    <!-- 字体图标备用方案 -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // 检查字体图标是否正确加载
        setTimeout(function() {
            var testIcon = document.createElement('i');
            testIcon.className = 'fas fa-user';
            testIcon.style.visibility = 'hidden';
            document.body.appendChild(testIcon);
            
            var iconStyle = window.getComputedStyle(testIcon);
            var isFontLoaded = iconStyle.fontFamily.includes('Font Awesome') || 
                               iconStyle.fontFamily.includes('FontAwesome');
            
            if (!isFontLoaded) {
                console.log('字体图标未正确加载，加载备用方案');
                // 加载备用CSS
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = '../static/download_style/css/font-awesome-4.7.0.min.css';
                document.head.appendChild(link);
            }
            
            document.body.removeChild(testIcon);
        }, 500);
    });
    </script>
    </head>

<body>
  <div class="layui-layout layui-layout-admin">
    <!-- 顶部导航 -->
    <div class="layui-header">
      <div class="layui-logo">医疗系统管理后台</div>
      <ul class="layui-nav layui-layout-right">
        <li class="layui-nav-item">
          <a href="javascript:;">
            <img src="/static/img/icon.png" class="layui-nav-img">
            {{ current_user.username }}
          </a>
          <dl class="layui-nav-child">
            <dd><a href="{{ url_for('logout') }}">退出登录</a></dd>
          </dl>
        </li>
      </ul>
    </div>

    <!-- 左侧菜单 -->
    <div class="layui-side layui-bg-black">
      <div class="layui-side-scroll">
        <ul class="layui-nav layui-nav-tree" data-lay-filter="test">
          <li class="layui-nav-item {{ 'layui-this' if request.endpoint == 'admin_index' else '' }}">
            <a href="{{ url_for('admin_index') }}"><i class="layui-icon">&#xe68e;</i> 首页</a>
          </li>
          <li class="layui-nav-item {{ 'layui-nav-itemed' if request.endpoint in ['admin_user_list','admin_user_add'] else '' }}">
            <a href="javascript:;">用户管理</a>
            <dl class="layui-nav-child">
              <dd class="{{ 'layui-this' if request.endpoint == 'admin_user_list' else '' }}"><a href="{{ url_for('admin_user_list') }}">用户列表</a></dd>
              <dd class="{{ 'layui-this' if request.endpoint == 'admin_user_add' else '' }}"><a href="{{ url_for('admin_user_add') }}">添加用户</a></dd>
            </dl>
          </li>
          <li class="layui-nav-item {{ 'layui-nav-itemed' if request.endpoint in ['admin_system_config','admin_logs','admin_backup'] else '' }}">
            <a href="javascript:;">系统设置</a>
            <dl class="layui-nav-child">
              <dd class="{{ 'layui-this' if request.endpoint == 'admin_system_config' else '' }}"><a href="{{ url_for('admin_system_config') }}">系统配置</a></dd>
              <dd class="{{ 'layui-this' if request.endpoint == 'admin_logs' else '' }}"><a href="{{ url_for('admin_logs') }}">操作日志</a></dd>
              <dd class="{{ 'layui-this' if request.endpoint == 'admin_backup' else '' }}"><a href="{{ url_for('admin_backup') }}">数据备份</a></dd>
            </dl>
          </li>
        </ul>
      </div>
    </div>


    <!-- 内容主体区域 -->
    <div class="layui-body">
      <div style="padding: 15px;">
        <div class="layui-card">
          <div class="layui-card-header">编辑用户</div>
          <div class="layui-card-body">
            <form class="layui-form" action="{{ url_for('admin_user_edit', user_id=user.user_id) }}" method="post">
              <div class="layui-form-item">
                <label class="layui-form-label">用户名</label>
                <div class="layui-input-block">
                  <input type="text" name="username" value="{{ user.username }}" readonly class="layui-input" style="background-color: #f2f2f2;">
                  <div class="layui-form-mid layui-word-aux">用户名不可修改</div>
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">真实姓名</label>
                <div class="layui-input-block">
                  <input type="text" name="real_name" required lay-verify="required" placeholder="请输入真实姓名"
                    autocomplete="off" class="layui-input" value="{{ user.real_name }}">
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">身份证号</label>
                <div class="layui-input-block">
                  <input type="text" name="id_card" placeholder="请输入身份证号" autocomplete="off" class="layui-input"
                    value="{{ user.id_card }}">
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">邮箱</label>
                <div class="layui-input-block">
                  <input type="email" name="email" placeholder="请输入邮箱" autocomplete="off" class="layui-input"
                    value="{{ user.email }}">
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">手机号</label>
                <div class="layui-input-block">
                  <input type="tel" name="phone" placeholder="请输入手机号" autocomplete="off" class="layui-input"
                    value="{{ user.phone }}">
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">用户角色</label>
                <div class="layui-input-block">
                  <select name="role" lay-verify="required">
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>管理员</option>
                    <option value="doctor" {% if user.role == 'doctor' %}selected{% endif %}>医生</option>
                    <option value="patient" {% if user.role == 'patient' %}selected{% endif %}>患者</option>
                  </select>
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">帐号状态</label>
                <div class="layui-input-block">
                  <input type="checkbox" name="is_active" lay-skin="switch" lay-text="启用|禁用" 
                    {% if user.is_active %}checked{% endif %}>
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">重置密码</label>
                <div class="layui-input-block">
                  <input type="password" name="password" placeholder="不修改密码请留空" autocomplete="off" class="layui-input">
                  <div class="layui-form-mid layui-word-aux">不修改密码请留空</div>
                </div>
              </div>
              <div class="layui-form-item">
                <div class="layui-input-block">
                  <button class="layui-btn" lay-submit lay-filter="formDemo">保存修改</button>
                  <a href="{{ url_for('admin_user_list') }}" class="layui-btn layui-btn-primary">返回</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    layui.use(['element', 'form', 'layer'], function() {
      var element = layui.element;
      var form = layui.form;
      var layer = layui.layer;
      
      // 监听表单提交
      form.on('submit(formDemo)', function(data) {
        // 默认提交表单行为
        return true;
      });
    });
  </script>
</body>

</html>
